name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main so an expiring advisory exception, a new RustSec or npm
  # advisory, or a date-bound release-contract check turns CI red within a
  # week of a quiet period (platform plan 10.2; audit DA-04). GitHub disables
  # scheduled workflows on a public repository after 60 days with no
  # repository activity, so this is not a signal for a repository that has
  # been quiet longer than that; see README.md (Quality gates).
  schedule:
    - cron: '23 9 * * 1'

concurrency:
  # The event name keeps scheduled runs in their own group, so a push to main
  # cannot cancel the weekly run part-way through.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.1'
  RUST_VERSION: '1.98.0'

jobs:
  frontend:
    name: Frontend (lint, tokens, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Enforce zero learned-model distribution
        run: npm run models:check

      - name: Verify deterministic JavaScript notices
        run: npm run notices:self-test && npm run notices:check

      - name: Release contract
        run: npm run release:check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Design tokens are in sync
        run: |
          npm run tokens
          git diff --exit-code src/styles/tokens.css || {
            echo '::error::src/styles/tokens.css is stale — run `npm run tokens` and commit the result'
            exit 1
          }

      - name: Characterization + unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Desktop bundle size budget
        run: npm run size:check

  # DA-13: this repository is public, so a committed credential is a
  # published one. Scan the whole history on pull requests, pushes to main
  # and the weekly run. The gitleaks GitHub Action is not used: it is under
  # a proprietary licence and needs a licence-key secret for organisation
  # repositories. The MIT gitleaks binary is built instead from a module
  # version whose hash the Go checksum database fixes, and the step checks
  # that hash again. Findings are printed redacted.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.11'
          cache: false

      - name: Install gitleaks v8.30.1
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go version -m "$(go env GOPATH)/bin/gitleaks" | grep -F 'h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=' || {
            echo '::error::the installed gitleaks module hash does not match the reviewed v8.30.1 hash'
            exit 1
          }

      - name: Scan the full git history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --exit-code 1 --log-opts=--all .'

  rust-dependency-policy:
    name: Rust dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo-deny covers only Cargo-resolved packages. Native sidecars,
      # sidecars and installer payloads use the separate
      # release inventory in THIRD_PARTY_LICENSES.md.
      # deny.toml carries no advisory exceptions, so every RustSec finding for
      # the release targets fails this blocking job.
      - name: Enforce Rust advisory policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          rust-version: '1.90.0'
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
          arguments: --locked --all-features

      - name: Enforce Rust license, source, and dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          rust-version: '1.90.0'
          manifest-path: src-tauri/Cargo.toml
          command: check bans licenses sources
          arguments: --locked --all-features

  rust:
    name: Rust (clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential pkg-config libssl-dev ffmpeg

      # tauri-build validates that configured externalBin sidecars exist.
      # FFmpeg comes from apt; release workflows replace it with pinned native
      # assets.
      - name: Provision sidecar binaries
        run: |
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)"  src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$(which ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Clippy (no warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      # The FFmpeg-backed tests (export records, synthetic SGMCA and .dm
      # conversions) skip themselves when FFmpeg, ffprobe or libopus is
      # missing; here a missing tool fails the job instead.
      - name: Characterization + unit tests
        env:
          DEPOAUDIO_REQUIRE_FFMPEG_TESTS: '1'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  rust-macos:
    name: Rust (macOS compile)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo check does not execute the sidecars, but tauri-build validates
      # that the target-specific paths exist while compiling the app config.
      - name: Provision sidecar placeholders
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
                src-tauri/binaries/ffprobe-aarch64-apple-darwin \
                src-tauri/binaries/ffmpeg-x86_64-apple-darwin \
                src-tauri/binaries/ffprobe-x86_64-apple-darwin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Compile macOS-specific Rust paths
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib
