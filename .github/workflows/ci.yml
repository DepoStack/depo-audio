name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, tokens, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Release contract
        run: npm run release:check

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Design tokens are in sync
        run: |
          npm run tokens
          git diff --exit-code src/styles/tokens.css || {
            echo '::error::src/styles/tokens.css is stale — run `npm run tokens` and commit the result'
            exit 1
          }

      - name: Characterization + unit tests
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            build-essential pkg-config libssl-dev ffmpeg

      # tauri-build validates that configured externalBin sidecars exist.
      # FFmpeg comes from apt; release workflows replace it with pinned native
      # assets and separately stage the signed ONNX Runtime library.
      - name: Provision sidecar binaries
        run: |
          mkdir -p src-tauri/binaries
          cp "$(which ffmpeg)"  src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          cp "$(which ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Clippy (no warnings)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Characterization + unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  rust-macos:
    name: Rust (macOS compile)
    runs-on: macos-latest
    env:
      ORT_MAC_ID: '253300416'
      ORT_MAC_SIZE: '54820264'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cargo check does not execute the sidecars, but tauri-build validates
      # that the target-specific paths exist while compiling the app config.
      - name: Provision sidecar placeholders
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
                src-tauri/binaries/ffprobe-aarch64-apple-darwin \
                src-tauri/binaries/ffmpeg-x86_64-apple-darwin \
                src-tauri/binaries/ffprobe-x86_64-apple-darwin

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)

      - name: Compile macOS-specific Rust paths
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --lib

      - name: Download pinned universal ONNX Runtime
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/onnxruntime
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_DOWNLOAD_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/microsoft/onnxruntime/releases/assets/${ORT_MAC_ID}" \
            -o ort.tgz
          actual_size=$(stat -f%z ort.tgz)
          test "$actual_size" = "$ORT_MAC_SIZE" || { echo "ERROR: pinned ONNX Runtime archive size mismatch"; exit 1; }
          tar xzf ort.tgz
          ort_dir=$(ls -d onnxruntime-osx-universal2-*)
          cp -L "$ort_dir/lib/libonnxruntime.dylib" src-tauri/resources/onnxruntime/libonnxruntime.dylib
          archs=$(lipo -archs src-tauri/resources/onnxruntime/libonnxruntime.dylib)
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) : ;;
            *) echo "ERROR: ONNX Runtime is not universal (got: $archs)"; exit 1 ;;
          esac

      - name: Run bundled ONNX Runtime inference smoke test
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/src-tauri/resources/onnxruntime/libonnxruntime.dylib
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml ort_loads_and_runs_silero_vad -- --ignored --nocapture
