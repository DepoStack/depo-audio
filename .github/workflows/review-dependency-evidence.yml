name: Review dependency evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  dependency-evidence:
    if: github.head_ref == 'review/depo-audio-skills-and-audits'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.98.0'
      - name: Resolve only advisory-affected compatible npm packages
        run: npm update vitest @vitest/mocker baseline-browser-mapping brace-expansion browserslist source-map-js undici --ignore-scripts --no-audit --no-fund
      - name: Resolve patched rustls
        run: cargo update --manifest-path src-tauri/Cargo.toml -p rustls --precise 0.23.45
      - name: Install resolved dependencies
        id: install
        run: npm ci
      - name: Audit resolved dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=moderate
      - name: Generate deterministic notices
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run notices:generate
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - name: Characterization and unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Build and size
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build && npm run size:check
      - name: Capture formatter output for review
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format
      - name: Export review-only patch and generated text files
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          payload = {path: pathlib.Path(path).read_text() for path in paths}
          raw = json.dumps(payload, sort_keys=True).encode()
          encoded = base64.b64encode(gzip.compress(raw, mtime=0)).decode()
          print('REVIEW_PAYLOAD_SHA256=' + hashlib.sha256(raw).hexdigest())
          for offset in range(0, len(encoded), 6000):
              print('REVIEW_PAYLOAD_CHUNK=' + encoded[offset:offset+6000])
          print('REVIEW_PAYLOAD_END')
          print(subprocess.check_output(['git', 'diff', '--stat'], text=True))
          pathlib.Path('review-generated.json').write_bytes(raw)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: review-generated-text
          path: review-generated.json
          retention-days: 7
