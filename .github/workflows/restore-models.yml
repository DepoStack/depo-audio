name: Verify AI models release

# Verifies the published `models-v1` byte contract used by already-published
# app versions. This workflow is deliberately read-only: a future model set must
# use a new versioned release tag and catalog URL, never replace published
# model bytes. The expected assets remain independently provable:
#   - 4 active bundled models come from resources/models/ in the current tree
#   - 3 retired DeepFilterNet files are reconstructed from the last published
#     app commit that bundled them
#   - speaker_embed.onnx was removed from the tree when it went
#     download-only, but the byte-identical blob is still in git history
#   - dnsmos_sig_bak_ovr.onnx was NEVER validly committed (the historical
#     file was a saved HTML error page), so it is fetched from Microsoft's
#     DNS-Challenge repo
# Every asset is verified against a reviewed SHA-256 value below. The active
# catalog values are also enforced by models.rs; retired assets are retained
# only in this verification contract for already-published app versions.
on:
  workflow_dispatch:

# The last tree that carried speaker_embed.onnx (v0.7.0). Blob verified:
# valid ONNX; SHA-256 matches the reviewed legacy value below.
env:
  LEGACY_DFN_COMMIT: '6113fac8d8bac8f240dd2b10de6e77cd79cc772c'
  SPEAKER_EMBED_COMMIT: 'b15b28c2d5c5872f073f30370b8facb203949b77'
  # Immutable upstream commit. The downloaded bytes are also checked against
  # the app's reviewed SHA-256 pin below.
  DNSMOS_URL: 'https://raw.githubusercontent.com/microsoft/DNS-Challenge/82f1b17e7776a43eee395d0f45bae8abb700ad00/DNSMOS/DNSMOS/sig_bak_ovr.onnx'

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # speaker_embed.onnx only exists in history
          fetch-depth: 0

      - name: Download the published model contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download models-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir published
          find published -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          sort > expected-assets.txt <<'EOF'
          dfn3_df_dec.onnx
          dfn3_enc.onnx
          dfn3_erb_dec.onnx
          dnsmos_sig_bak_ovr.onnx
          flashsr.onnx
          silero_vad.onnx
          smart-turn-v3-int8.onnx
          speaker_embed.onnx
          speaker_seg_int8.onnx
          EOF
          diff -u expected-assets.txt actual-assets.txt

      - name: Reconstruct the reviewed source bytes
        run: |
          set -euo pipefail
          mkdir -p expected
          for f in silero_vad smart-turn-v3-int8 flashsr speaker_seg_int8; do
            cp "src-tauri/resources/models/$f.onnx" expected/
          done
          for f in dfn3_enc dfn3_erb_dec dfn3_df_dec; do
            git cat-file -p "${LEGACY_DFN_COMMIT}:src-tauri/resources/models/$f.onnx" \
              > "expected/$f.onnx"
          done
          git cat-file -p "${SPEAKER_EMBED_COMMIT}:src-tauri/resources/models/speaker_embed.onnx" \
            > expected/speaker_embed.onnx
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$DNSMOS_URL" -o expected/dnsmos_sig_bak_ovr.onnx
          ls -l expected/

      - name: Verify published integrity and source identity
        run: |
          set -euo pipefail
          cd published
          sha256sum -c <<'EOF'
          a4a068cd6cf1ea8355b84327595838ca748ec29a25bc91fc82e6c299ccdc5808  silero_vad.onnx
          3d072c8fb04446955a365b533686e7e06015ad09929bb824b910c72ff89f5be1  smart-turn-v3-int8.onnx
          e255c76b227f16f7f392cc43677c38bd2c5aa129f042a2ba3eb03fb29e470c7a  flashsr.onnx
          7c5399d3da8a50ebef1c1a0ae421b33376aa5e45d0e92df16da7e83c9c131916  dfn3_enc.onnx
          ab669a1d10afe20911728b33053a452071042317a90581092b325da7b2f9d895  dfn3_erb_dec.onnx
          23114ce3b0f6464b763ee62f7bb8aab6b2a129a21eabd5bcfe59413db05f278a  dfn3_df_dec.onnx
          d582f4b4c6b48205de7e0643c57df0df5615a3c176189be3fc461e9d18827b5d  speaker_seg_int8.onnx
          1a331345f04805badbb495c775a6ddffcdd1a732567d5ec8b3d5749e3c7a5e4b  speaker_embed.onnx
          269fbebdb513aa23cddfbb593542ecc540284a91849ac50516870e1ac78f6edd  dnsmos_sig_bak_ovr.onnx
          EOF
          # Belt-and-suspenders: no asset may be textual (the DNSMOS incident)
          for f in *.onnx; do
            if head -c1 "$f" | grep -q '[<{]'; then
              echo "ERROR: $f looks like text, not a model"; exit 1
            fi
          done
          cd ..
          for f in expected/*.onnx; do
            cmp --silent "$f" "published/${f#expected/}" || {
              echo "ERROR: published ${f#expected/} differs from its reviewed source bytes"; exit 1;
            }
          done
