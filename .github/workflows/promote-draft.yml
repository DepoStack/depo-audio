name: Audit release draft

# Historical versions of this workflow copied late assets into an already
# published release. That made a public release mutable and could expose a
# temporarily incomplete asset set. Publication is now deliberately separate:
# this workflow only verifies one commit-bound private draft and never uploads,
# deletes, promotes, or publishes release data.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Private release draft tag to audit'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify one private, immutable-candidate draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo 'ERROR: invalid release tag'; exit 1;
          }
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo 'ERROR: the release is already published; published assets are immutable'
            exit 1
          fi

          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp)
          drafts=$(jq -s --arg tag "$TAG" '
            add | flatten | map(select(.draft == true and .tag_name == $tag))
          ' <<<"$releases")
          jq -e '
            length == 1 and
            (.[0].id | type == "number" and . > 0) and
            (.[0].target_commitish | type == "string" and test("^[0-9a-f]{40}$")) and
            (.[0].assets | length > 0) and
            all(.[0].assets[];
              (.id | type == "number" and . > 0) and
              (.name | type == "string" and length > 0) and
              (.size | type == "number" and . > 0) and
              .state == "uploaded"
            ) and
            (([.[0].assets[].name] | unique | length) == (.[0].assets | length))
          ' <<<"$drafts" >/dev/null || {
            echo 'ERROR: expected exactly one complete commit-bound private draft'; exit 1;
          }

          release_id=$(jq -r '.[0].id' <<<"$drafts")
          target=$(jq -r '.[0].target_commitish' <<<"$drafts")
          echo "Verified private draft $release_id for $TAG at $target"
          jq -r '.[0].assets[] | "  \(.name)  (\(.size) bytes)"' <<<"$drafts"
          echo 'No release data was changed. Publication remains a separate human decision.'
