name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.9.0)'
        required: true
        type: string

# One release run per tag at a time: overlapping runs for the same tag can
# split platforms across drafts (each leg looks the release up independently).
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Pin the compiler and Node runtime used by the verified candidate. Action
  # commits alone do not pin the toolchains they install.
  NODE_VERSION: '22.23.1'
  RUST_VERSION: '1.98.0'
  CARGO_ABOUT_URL: 'https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz'
  CARGO_ABOUT_SIZE: '6732751'
  CARGO_ABOUT_SHA256: '9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af'
  CARGO_CYCLONEDX_URL: 'https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz'
  CARGO_CYCLONEDX_SIZE: '1766496'
  CARGO_CYCLONEDX_SHA256: '9bd3e599314f50810c9d98b8b68a617ff9d3cc20873968d90b29d121f6b226ff'
  # Build both macOS slices from one reviewed LGPL source set. The prior
  # community binaries enabled FFmpeg's nonfree/unredistributable mode and
  # mixed major versions, so release builds must never consume them again.
  FFMPEG_SOURCE_URL: 'https://ffmpeg.org/releases/ffmpeg-7.1.5.tar.xz'
  FFMPEG_SOURCE_SIZE: '11050340'
  FFMPEG_SOURCE_SHA256: 'de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f'
  LAME_SOURCE_URL: 'https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz'
  LAME_SOURCE_SIZE: '1524133'
  LAME_SOURCE_SHA256: 'ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e'
  OPUS_SOURCE_URL: 'https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz'
  OPUS_SOURCE_SIZE: '10472813'
  OPUS_SOURCE_SHA256: '6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1'
  # BtbN deletes ordinary daily assets after its rolling retention window.
  # Pin the 2026-07-31 month-end build, which upstream retains for two years,
  # instead of an asset from the short-lived `latest` release.
  # Static LGPL build. The exact archive, included LGPL text, build
  # configuration, required FTR decoder, and released output encoders are
  # verified before its sidecars can enter an installer.
  FFMPEG_WIN_ID: '496767001'
  FFMPEG_WIN_SIZE: '147672337'
  FFMPEG_WIN_SHA256: '5d65df0c0ca5346d82df8ade9c2e12db45d1f978f18ff908b42f03f5223dfc90'

jobs:
  # Guard the release before any build starts:
  #  - the tag must match the configured app version, so binaries can't ship
  #    self-reporting a different version than their tag
  #  - any stale DRAFT carrying this tag fails the run for manual review; the
  #    workflow never deletes it. A fresh private draft is created explicitly
  #    for this commit, while tauri-action remains build-only. Published
  #    releases are never touched.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release source is main
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: release workflow must be dispatched from refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "ERROR: release commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Enforce zero learned-model distribution
        run: npm run models:self-test && npm run models:check

      - name: Verify deterministic JavaScript notices
        run: npm run notices:self-test && npm run notices:check

      # Fail closed unless every emitted production JavaScript/CSS component
      # has exact approved notice evidence. The local scroll-lock compatibility
      # alias deliberately keeps the incomplete third-party helper out of the
      # shipped graph.
      - name: Enforce strict JavaScript notice approval
        run: node scripts/generate-javascript-notices.mjs --strict --check

      - name: Verify private-draft build contract
        run: node scripts/release-contract-check.mjs

      - name: Verify tag matches the configured app version
        env:
          # env indirection: never interpolate the expression into shell
          # source, so the value can't be parsed as script
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          tag = os.environ['TAG']
          with open('src-tauri/tauri.conf.json', encoding='utf-8') as handle:
              version = json.load(handle)['version']
          pattern = rf"v{re.escape(version)}(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          if re.fullmatch(pattern, tag) is None:
              raise SystemExit(
                  f"ERROR: tag {tag!r} is not a safe release tag for app version {version!r}"
              )
          print(f"Tag {tag} matches app version {version}")
          PY

      - name: Verify synthetic FTR fixture generator
        run: npm run ftr:self-test

      - name: Verify release commit and published-release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          tagged_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "ERROR: a published release already exists for $tag; refusing to replace its assets"
            exit 1
          fi
          if [ -n "$tagged_commit" ]; then
            echo "ERROR: tag $tag already exists at $tagged_commit before candidate construction"
            echo 'The protected publication workflow must create or verify the approved tag.'
            exit 1
          fi
          echo "Tag $tag does not exist yet and may be bound during protected publication"

      - name: Reject a stale draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          stale=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp | jq -s --arg tag "$tag" '
            add | flatten | map(select(.draft == true and .tag_name == $tag))
          ')
          if [ "$(jq 'length' <<<"$stale")" != '0' ]; then
            echo "ERROR: an existing private draft already uses $tag"
            jq -r '.[] | "  draft \(.id), target \(.target_commitish), assets \(.assets | length)"' <<<"$stale"
            echo 'Review and reconcile it manually; the release workflow never deletes drafts.'
            exit 1
          fi

      - name: Create one commit-bound draft release
        id: create-draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          notes=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'

          const version = JSON.parse(readFileSync('package.json', 'utf8')).version
          const changelog = readFileSync('CHANGELOG.md', 'utf8')
          const marker = `## [${version}] - `
          const start = changelog.indexOf(marker)
          if (start < 0) throw new Error(`Missing CHANGELOG section for ${version}`)
          const next = changelog.indexOf('\n## [', start + marker.length)
          const section = changelog.slice(start, next < 0 ? undefined : next).trim()
          if (!section.includes('### Release scope')) throw new Error('Release notes have no release scope')
          process.stdout.write(section)
          NODE
          )
          payload=$(jq -n \
            --arg tag "$TAG" \
            --arg name "DepoAudio $TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg body "$notes" \
            --argjson prerelease "$prerelease" \
            '{
              tag_name: $tag,
              name: $name,
              target_commitish: $commit,
              body: $body,
              draft: true,
              prerelease: $prerelease
            }')
          release=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input - <<<"$payload")
          release_id=$(jq -er \
            --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
            'select(.draft == true and .tag_name == $tag and .target_commitish == $commit) | .id' \
            <<<"$release")
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'ERROR: GitHub did not return a valid commit-bound draft release ID'; exit 1;
          }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Created private draft release $release_id for $TAG at $GITHUB_SHA"

  release:
    needs: [prepare, dependency-evidence]
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # Keep candidate builds serialized so draft uploads and evidence remain
      # easy to audit. Tauri itself is build-only and never writes latest.json.
      max-parallel: 1
      matrix:
        include:
          # One universal macOS artifact (Apple Silicon + Intel in a single
          # .app/.dmg). Rust cross-compiles both slices on the hosted macOS
          # runner and `lipo` fuses them, independent of the runner's host CPU.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Download verified dependency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/depoaudio-dependency-evidence

      - name: Stage the regenerated Rust license report
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          evidence_dir="$RUNNER_TEMP/depoaudio-dependency-evidence"
          (
            cd "$evidence_dir"
            sha256sum -c SHA256SUMS-dependency-evidence.txt
          )
          source="$evidence_dir/DepoAudio_${version}_rust-third-party-licenses.html"
          test -s "$source"
          cp "$source" src-tauri/resources/third-party/rust/THIRD-PARTY-LICENSES.html

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Create binaries directory
        run: mkdir -p src-tauri/binaries

      # ── FFmpeg sidecars ─────────────────────────────────────────────────
      # macOS: compile the same reviewed LGPL FFmpeg/LAME/Opus sources for both
      # architectures. The script rejects GPL/nonfree configurations, checks
      # every released codec/filter contract, preserves notices and source
      # hashes, then stages thin and universal sidecars for Tauri.
      - name: Install macOS FFmpeg build prerequisites
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config

      - name: Build universal FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/build-ffmpeg-macos.sh

      - name: Download FFmpeg (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_DOWNLOAD_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $url = "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/assets/$env:FFMPEG_WIN_ID"
          Invoke-WebRequest $url -Headers $headers -OutFile ffmpeg.zip
          if ((Get-Item ffmpeg.zip).Length -ne [int64]$env:FFMPEG_WIN_SIZE) {
            throw "Pinned FFmpeg archive size mismatch"
          }
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "Pinned FFmpeg archive hash mismatch: $hash" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin   = Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $bin -or -not $probe) { throw "Pinned FFmpeg archive is missing ffmpeg.exe or ffprobe.exe" }
          $archiveRoot = $bin.Directory.Parent
          $license = Join-Path $archiveRoot.FullName 'LICENSE.txt'
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) {
            throw "Pinned FFmpeg archive is missing LICENSE.txt"
          }
          $licenseHash = (Get-FileHash -LiteralPath $license -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($licenseHash -ne 'da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768') {
            throw "Pinned FFmpeg LICENSE.txt hash mismatch: $licenseHash"
          }
          Copy-Item $bin.FullName   src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item $probe.FullName src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe
          $noticeDir = 'src-tauri/resources/third-party/ffmpeg'
          New-Item -ItemType Directory -Force -Path $noticeDir | Out-Null
          Copy-Item -LiteralPath $license -Destination (Join-Path $noticeDir 'LICENSE.txt')
          & $bin.FullName -version | Set-Content -LiteralPath (Join-Path $noticeDir 'BUILD-CONFIGURATION.txt') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Pinned FFmpeg binary could not report its build configuration" }
          @(
            'Binary distribution: BtbN/FFmpeg-Builds'
            'Release: https://github.com/BtbN/FFmpeg-Builds/releases/tag/autobuild-2026-07-31-14-10'
            'Asset: ffmpeg-N-125875-g5d4d3bdc61-win64-lgpl.zip'
            'Asset SHA-256: 5d65df0c0ca5346d82df8ade9c2e12db45d1f978f18ff908b42f03f5223dfc90'
            'Upstream FFmpeg source: https://github.com/FFmpeg/FFmpeg/commit/5d4d3bdc61412641883a45e060e810f80ea7f4b5'
            'This file records provenance; it is not a legal compliance determination.'
          ) | Set-Content -LiteralPath (Join-Path $noticeDir 'SOURCE.txt') -Encoding utf8

      - name: Verify FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== src-tauri/binaries/ ==="
          ls -lh src-tauri/binaries/
          file src-tauri/binaries/ff* || true

      - name: Verify FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem src-tauri/binaries/

      - name: Generate synthetic FTR decode fixture (macOS)
        if: runner.os == 'macOS'
        run: >-
          node scripts/ftr-smoke-fixture.mjs --generate
          --ffmpeg src-tauri/binaries/ffmpeg-universal-apple-darwin

      - name: Generate synthetic FTR decode fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          node scripts/ftr-smoke-fixture.mjs --generate
          --ffmpeg src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Smoke-test native FTR decoding and released encoders (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          fixture_path="$RUNNER_TEMP/depoaudio-ftr-smoke/ftr-smoke.trm"
          for ffmpeg in \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          do
            "$ffmpeg" -hide_banner -v error \
              -c:a ftr -t 5 -i "$fixture_path" -map 0:a:0 -f null -
            arch=$(basename "$ffmpeg")
            for spec in \
              'wav:pcm_s16le' \
              'mp3:libmp3lame' \
              'flac:flac' \
              'opus:libopus' \
              'm4a:aac'
            do
              extension=${spec%%:*}
              codec=${spec#*:}
              output="$RUNNER_TEMP/$arch-smoke.$extension"
              "$ffmpeg" -hide_banner -v error -xerror \
                -c:a ftr -t 1 -i "$fixture_path" -map 0:a:0 -ac 1 \
                -c:a "$codec" -y "$output"
              test -s "$output" || { echo "ERROR: $arch produced no $extension output"; exit 1; }
              rm -f -- "$output"
            done
          done

      - name: Smoke-test native FTR decoding and released encoders (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixturePath = Join-Path $env:RUNNER_TEMP 'depoaudio-ftr-smoke\ftr-smoke.trm'
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -v error `
            -c:a ftr -t 5 -i $fixturePath -map 0:a:0 -f null NUL
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed native FTR decode smoke test" }
          $ffmpeg = Resolve-Path 'src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe'
          $variants = @(
            @{ Extension = 'wav'; Codec = 'pcm_s16le' }
            @{ Extension = 'mp3'; Codec = 'libmp3lame' }
            @{ Extension = 'flac'; Codec = 'flac' }
            @{ Extension = 'opus'; Codec = 'libopus' }
            @{ Extension = 'm4a'; Codec = 'aac' }
          )
          foreach ($variant in $variants) {
            $output = Join-Path $env:RUNNER_TEMP "depoaudio-encoder-smoke.$($variant.Extension)"
            $arguments = @(
              '-hide_banner', '-v', 'error', '-xerror',
              '-c:a', 'ftr', '-t', '1', '-i', $fixturePath,
              '-map', '0:a:0', '-ac', '1', '-c:a', $variant.Codec,
              '-y', $output
            )
            & $ffmpeg @arguments
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output) -or (Get-Item $output).Length -eq 0) {
              throw "Bundled FFmpeg failed $($variant.Extension) encoder smoke test"
            }
            Remove-Item -LiteralPath $output -Force
          }

      - name: Remove synthetic FTR fixture from the release workspace
        if: always()
        run: node scripts/ftr-smoke-fixture.mjs --clean

      # Reconfirm source and notice policy after native sidecars are staged.
      - name: Recheck release distribution gates before packaging
        run: |
          npm run models:check
          node scripts/generate-javascript-notices.mjs --strict --check

      - name: Write the pre-package binary and notice contract
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS) platform=macos ;;
            Windows) platform=windows ;;
            *) echo "ERROR: unsupported release runner $RUNNER_OS"; exit 1 ;;
          esac
          node scripts/release-artifact-inventory.mjs \
            --write-contract \
            --root src-tauri \
            --platform "$platform" \
            --output src-tauri/resources/third-party/release/BINARY-CONTRACT.json

      # ── Release signing (opt-in) ────────────────────────────────────────
      # Code signing / notarization and signed auto-updates are OPT-IN and
      # switch on per-capability once their secrets exist. Until then the
      # release still ships: an ad-hoc-signed macOS app and unsigned Windows
      # installers, with the in-app updater dormant. Platform warnings may
      # appear, but their exact behavior must be verified for each published
      # asset. Adding the secrets later enables signing/updates with no workflow
      # change. A completely absent capability group is allowed; a partially
      # configured group fails closed so an intended signed build cannot
      # silently fall back to unsigned output.
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          have() { for n in "$@"; do [ -n "${!n:-}" ] || return 1; done; return 0; }
          reject_partial() {
            local group="$1"; shift
            local present=0
            for n in "$@"; do [ -n "${!n:-}" ] && present=$((present + 1)); done
            if [ "$present" -ne 0 ] && [ "$present" -ne "$#" ]; then
              echo "::error::$group signing configuration is partial ($present of $# required values present)."
              exit 1
            fi
          }

          reject_partial 'Updater' TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBLIC_KEY
          reject_partial 'Apple' APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          reject_partial 'Windows' WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_THUMBPRINT

          updater=false
          if have TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBLIC_KEY; then
            updater=true
          else
            echo "::notice::Updater signing secrets absent — building without signed auto-update artifacts (updater stays dormant)."
          fi

          platform_signing=false
          if [ "$RUNNER_OS" = "macOS" ]; then
            if have APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; then
              platform_signing=true
            else
              echo "::notice::Apple signing/notarization secrets absent — building an UNSIGNED macOS app (ad-hoc signature)."
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if have WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_THUMBPRINT; then
              platform_signing=true
            else
              echo "::notice::Windows signing secrets absent — building an UNSIGNED Windows installer."
            fi
          fi

          {
            echo "updater=$updater"
            echo "platform_signing=$platform_signing"
          } >> "$GITHUB_OUTPUT"

      # The Tauri CLI has a signer but no verify subcommand. Sign a disposable
      # nonce with the exact project-pinned CLI, then verify that signature
      # using the same minisign-verify version/checksum locked by the app's
      # updater dependency. No key material is written or printed.
      - name: Verify updater signing key pair
        if: steps.signing.outputs.updater == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          verify_dir=$(mktemp -d "${RUNNER_TEMP}/depoaudio-key-check.XXXXXX")
          trap 'rm -rf -- "$verify_dir"' EXIT

          payload="$verify_dir/updater-key-check"
          printf '%s\n' "depo-audio:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$RUNNER_OS" > "$payload"
          npm run tauri -- signer sign "$payload" >/dev/null
          test -s "$payload.sig" || {
            echo "::error::Tauri signer did not create a signature"; exit 1;
          }
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          mkdir -p "$verify_dir/src"
          cat > "$verify_dir/Cargo.toml" <<'TOML'
          [package]
          name = "depoaudio-updater-key-check"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          base64 = "=0.22.1"
          minisign-verify = "=0.2.5"
          TOML
          cat > "$verify_dir/Cargo.lock" <<'LOCK'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4

          [[package]]
          name = "base64"
          version = "0.22.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "72b3254f16251a8381aa12e40e3c4d2f0199f8c6508fbecb9d91f575e0fbb8c6"

          [[package]]
          name = "depoaudio-updater-key-check"
          version = "0.0.0"
          dependencies = [
           "base64",
           "minisign-verify",
          ]

          [[package]]
          name = "minisign-verify"
          version = "0.2.5"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "22f9645cb765ea72b8111f36c522475d2daa0d22c957a9826437e97534bc4e9e"
          LOCK
          cat > "$verify_dir/src/main.rs" <<'RUST'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env, fs, path::PathBuf};

          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let mut args = env::args_os().skip(1);
              let payload = PathBuf::from(args.next().ok_or("missing payload path")?);
              let signature_path = PathBuf::from(args.next().ok_or("missing signature path")?);
              if args.next().is_some() {
                  return Err("unexpected verifier argument".into());
              }

              // Tauri updater configuration stores base64 of the complete
              // Minisign public-key file, and .sig contains base64 of the
              // complete Minisign signature. Decode exactly as the updater.
              let public_key_encoded = env::var("TAURI_UPDATER_PUBLIC_KEY")?;
              let public_key_text = String::from_utf8(
                  STANDARD
                      .decode(public_key_encoded.trim())
                      .map_err(|_| "updater public key is not valid base64")?,
              )?;
              let public_key = PublicKey::decode(public_key_text.trim())
                  .map_err(|error| format!("invalid updater public key: {error}"))?;

              let signature_encoded = fs::read_to_string(&signature_path)?;
              let signature_text = String::from_utf8(
                  STANDARD
                      .decode(signature_encoded.trim())
                      .map_err(|_| "Tauri signature is not valid base64")?,
              )?;
              let signature = Signature::decode(signature_text.trim())
                  .map_err(|error| format!("invalid Tauri signature: {error}"))?;
              let data = fs::read(payload)?;
              public_key
                  .verify(&data, &signature, true)
                  .map_err(|error| format!("configured updater keys do not match: {error}"))?;
              println!("Updater signing key pair verified.");
              Ok(())
          }
          RUST

          cargo run --locked --quiet --manifest-path "$verify_dir/Cargo.toml" -- \
            "$payload" "$payload.sig"

      # Release Tauri config overlay, always generated. It carries the exact
      # native and notice evidence into both installers. Signed updater
      # artifacts and Windows Authenticode signing are layered on only when
      # their secrets are present. Tauri deep-merges this overlay.
      - name: Generate release configuration
        shell: bash
        env:
          UPDATER_ENABLED: ${{ steps.signing.outputs.updater }}
          PLATFORM_SIGNING: ${{ steps.signing.outputs.platform_signing }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          jq \
            --arg pubkey "$TAURI_UPDATER_PUBLIC_KEY" \
            --arg runner "$RUNNER_OS" \
            --arg thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT" \
            --argjson updater "$UPDATER_ENABLED" \
            --argjson platformSigning "$PLATFORM_SIGNING" '
            (if ($runner == "Windows" or $runner == "macOS") then {
                resources: ((.bundle.resources + [
                  "resources/third-party/ffmpeg",
                  "resources/third-party/javascript",
                  "resources/third-party/release"
                ]) | unique)
              } else error("unsupported release runner: " + $runner) end) as $base
            # Signed auto-update artifacts — only with updater secrets.
            | (if $updater then { createUpdaterArtifacts: true } else {} end) as $upd
            # Windows Authenticode signing — only with the Windows cert.
            | (if ($platformSigning and $runner == "Windows") then {
                windows: {
                  certificateThumbprint: $thumbprint,
                  digestAlgorithm: "sha256",
                  timestampUrl: "http://timestamp.digicert.com"
                }
              } else {} end) as $win
            | {
                bundle: ($base + $upd + $win)
              }
              + (if $updater then {
                  plugins: { updater: {
                    endpoints: ["https://github.com/DepoStack/depo-audio/releases/latest/download/latest.json"],
                    pubkey: $pubkey
                  } }
                } else {} end)
          ' src-tauri/tauri.conf.json > src-tauri/tauri.release.conf.json
          echo "== generated tauri.release.conf.json =="
          cat src-tauri/tauri.release.conf.json

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.platform_signing == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "depoaudio-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item -LiteralPath $pfx -Force
          $certificate = Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction Stop
          if (!$certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }

      # Signing credentials remain scoped to their packaging step. Candidate
      # executables never inherit them during post-package validation.
      - name: Build unsigned macOS packages
        if: runner.os == 'macOS' && steps.signing.outputs.platform_signing != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: '--config src-tauri/tauri.release.conf.json ${{ matrix.args }}'

      - name: Build signed and notarized macOS packages
        if: runner.os == 'macOS' && steps.signing.outputs.platform_signing == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: '--config src-tauri/tauri.release.conf.json ${{ matrix.args }}'

      # ── Build & release ────────────────────────────────────────────────
      - name: Build Windows packages
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          # Updater artifact signing key. Empty when no updater secret is set;
          # the Tauri bundler only consumes it when createUpdaterArtifacts is
          # true (i.e. when the updater overlay is active), so an empty value is
          # inert on an unsigned build. All Apple signing/notarization
          # credentials are provided instead by the "Configure macOS code
          # signing identity" step via $GITHUB_ENV — and deliberately left UNSET
          # (not empty) on an unsigned build so the bundler skips cert import.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: '--config src-tauri/tauri.release.conf.json ${{ matrix.args }}'

      - name: Remove Windows signing certificate before candidate execution
        if: always() && runner.os == 'Windows' && steps.signing.outputs.platform_signing == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $certificatePath = "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT"
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -DeleteKey -Force
          }
          if (Test-Path -LiteralPath $certificatePath) {
            throw 'Windows signing certificate remained in the user store after packaging'
          }

      - name: Verify WebView2 offline-installer build inputs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          & ./scripts/windows-webview2-evidence.ps1 `
            -OutputPath (Join-Path $env:RUNNER_TEMP 'WEBVIEW2-EVIDENCE-windows.json') `
            -SignatureReportPath (Join-Path $env:RUNNER_TEMP 'WEBVIEW2-SIGNATURE-windows.txt')

      # The component checks above do not exercise Tauri's embedded plugin
      # configuration. Launch the exact bundled application before the workflow
      # can finish so a setup panic is visible before anyone publishes the draft.
      - name: Smoke-test packaged app startup (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle\msi'
          $msi = Get-ChildItem -LiteralPath $bundleRoot -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw "No packaged MSI found under $bundleRoot" }

          $extractDir = Join-Path $env:RUNNER_TEMP 'depoaudio-msi-smoke'
          $msiLog = Join-Path $env:RUNNER_TEMP 'depoaudio-msi-smoke.log'
          $extract = Start-Process msiexec.exe -ArgumentList @(
            '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extractDir`"", '/L*v', "`"$msiLog`""
          ) -Wait -PassThru
          if ($extract.ExitCode -ne 0) {
            Get-Content -LiteralPath $msiLog -Tail 200
            throw "MSI administrative extraction failed with exit code $($extract.ExitCode)"
          }

          $app = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter 'depo-audio.exe' -File | Select-Object -First 1
          if (-not $app) { throw 'The extracted MSI does not contain depo-audio.exe' }
          $stdout = Join-Path $env:RUNNER_TEMP 'depoaudio-startup-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'depoaudio-startup-stderr.txt'
          $process = Start-Process -FilePath $app.FullName -WorkingDirectory $app.DirectoryName -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(12)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            } while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline)

            if ($process.HasExited) {
              Write-Host '== packaged app stdout =='
              if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
              Write-Host '== packaged app stderr =='
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
              throw "Packaged app exited during startup with code $($process.ExitCode)"
            }
            Write-Host 'Packaged Windows app remained alive through the startup smoke window.'
          } finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
          }

      - name: Smoke-test downloadable macOS containers
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECT_PLATFORM_SIGNING: ${{ steps.signing.outputs.platform_signing }}
        run: bash scripts/macos-packaged-smoke.sh

      - name: Smoke-test packaged native payloads and NSIS startup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-packaged-smoke.ps1

      - name: Publish macOS inventory and checksum evidence to the draft
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/universal-apple-darwin/release/bundle -type f -name '*.dmg' -print -quit)
          app_archive=$(find src-tauri/target/universal-apple-darwin/release/bundle -type f -name '*.app.tar.gz' -print -quit)
          test -n "$dmg" && test -n "$app_archive" || {
            echo "ERROR: macOS artifact pair is incomplete"; exit 1;
          }

          mount_point="$RUNNER_TEMP/depoaudio-dmg-audit"
          archive_root="$RUNNER_TEMP/depoaudio-app-archive-audit"
          mkdir -p "$mount_point" "$archive_root"
          mounted=false
          cleanup_audit() {
            if [ "$mounted" = "true" ]; then hdiutil detach "$mount_point" -quiet || true; fi
          }
          trap cleanup_audit EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" -quiet
          mounted=true
          dmg_app=$(find "$mount_point" -maxdepth 2 -type d -name 'DepoAudio.app' -print -quit)
          test -n "$dmg_app" || { echo "ERROR: DMG contains no DepoAudio.app"; exit 1; }
          tar xzf "$app_archive" -C "$archive_root"
          archive_app=$(find "$archive_root" -maxdepth 2 -type d -name 'DepoAudio.app' -print -quit)
          test -n "$archive_app" || { echo "ERROR: app archive contains no DepoAudio.app"; exit 1; }

          dmg_inventory="$RUNNER_TEMP/RELEASE-INVENTORY-macos-dmg.json"
          archive_inventory="$RUNNER_TEMP/RELEASE-INVENTORY-macos-app-archive.json"
          node scripts/release-artifact-inventory.mjs \
            --root "$dmg_app" --platform macos --output "$dmg_inventory" \
            --contract src-tauri/resources/third-party/release/BINARY-CONTRACT.json
          node scripts/release-artifact-inventory.mjs \
            --root "$archive_app" --platform macos --output "$archive_inventory" \
            --contract src-tauri/resources/third-party/release/BINARY-CONTRACT.json
          cmp "$dmg_inventory" "$archive_inventory" || {
            echo "ERROR: DMG and app archive inventories differ"; exit 1;
          }
          hdiutil detach "$mount_point" -quiet
          mounted=false

          manifest="$RUNNER_TEMP/SHA256SUMS-macos.txt"
          while IFS= read -r artifact; do
            hash=$(shasum -a 256 "$artifact" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$artifact")"
          done < <(find src-tauri/target/universal-apple-darwin/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' \) | sort) > "$manifest"
          test "$(wc -l < "$manifest" | tr -d '[:space:]')" = "2" || {
            echo "ERROR: expected exactly one DMG and one app archive"; cat "$manifest"; exit 1;
          }
          cat "$manifest"

          source_dir="$RUNNER_TEMP/depoaudio-third-party-source"
          test -d "$source_dir" || { echo "ERROR: corresponding-source directory is missing"; exit 1; }
          for source in \
            sources/ffmpeg-7.1.5.tar.xz \
            sources/lame-3.100.tar.gz \
            sources/opus-1.6.1.tar.gz \
            build-ffmpeg-macos.sh \
            changes.diff \
            notices/SOURCE.txt
          do
            test -f "$source_dir/$source" || { echo "ERROR: source bundle is missing $source"; exit 1; }
          done
          test ! -s "$source_dir/changes.diff" || {
            echo "ERROR: no-patch changes.diff must be empty"; exit 1;
          }
          version=$(node -p "require('./package.json').version")
          source_archive="$RUNNER_TEMP/DepoAudio_${version}_third-party-source.tar.gz"
          tar czf "$source_archive" -C "$RUNNER_TEMP" depoaudio-third-party-source
          source_manifest="$RUNNER_TEMP/SHA256SUMS-third-party-source.txt"
          source_hash=$(shasum -a 256 "$source_archive" | awk '{print $1}')
          printf '%s  %s\n' "$source_hash" "$(basename "$source_archive")" > "$source_manifest"
          cat "$source_manifest"

          release_assets=("$dmg" "$app_archive")
          while IFS= read -r signature; do
            release_assets+=("$signature")
          done < <(find src-tauri/target/universal-apple-darwin/release/bundle \
            -type f -name '*.sig' | sort)
          node scripts/upload-draft-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --commit "$GITHUB_SHA" -- \
            "${release_assets[@]}" \
            "$manifest" "$source_manifest" "$source_archive" "$dmg_inventory" "$archive_inventory"

      - name: Publish Windows inventories and checksum evidence to the draft
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle'
          $artifacts = @(
            Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'msi') -Filter '*.msi' -File
            Get-ChildItem -LiteralPath (Join-Path $bundleRoot 'nsis') -Filter '*.exe' -File
          ) | Sort-Object Name
          if ($artifacts.Count -ne 2) {
            throw "Expected exactly one MSI and one NSIS installer; found $($artifacts.Count)"
          }

          $msiRoot = Join-Path $env:RUNNER_TEMP 'depoaudio-msi-smoke'
          if (-not (Test-Path -LiteralPath $msiRoot -PathType Container)) {
            throw 'The MSI startup smoke extraction is unavailable for inventory'
          }
          $msiInventory = Join-Path $env:RUNNER_TEMP 'RELEASE-INVENTORY-windows-msi.json'
          $binaryContract = 'src-tauri/resources/third-party/release/BINARY-CONTRACT.json'
          node scripts/release-artifact-inventory.mjs `
            --root $msiRoot --platform windows --output $msiInventory --contract $binaryContract

          $nsis = $artifacts | Where-Object Extension -eq '.exe' | Select-Object -First 1
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'depoaudio-nsis-audit'
          if (-not (Test-Path -LiteralPath $nsisRoot -PathType Container)) {
            throw 'The NSIS smoke extraction is unavailable for inventory'
          }
          $nsisApp = Get-ChildItem -LiteralPath $nsisRoot -Recurse -Filter 'depo-audio.exe' -File | Select-Object -First 1
          if (-not $nsisApp) { throw 'The extracted NSIS payload does not contain depo-audio.exe' }
          $nsisInventory = Join-Path $env:RUNNER_TEMP 'RELEASE-INVENTORY-windows-nsis.json'
          node scripts/release-artifact-inventory.mjs `
            --root $nsisRoot --platform windows --output $nsisInventory --contract $binaryContract

          $lines = $artifacts | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $manifest = Join-Path $env:RUNNER_TEMP 'SHA256SUMS-windows.txt'
          [IO.File]::WriteAllLines($manifest, $lines, [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $manifest
          $webviewEvidence = Join-Path $env:RUNNER_TEMP 'WEBVIEW2-EVIDENCE-windows.json'
          $webviewSignature = Join-Path $env:RUNNER_TEMP 'WEBVIEW2-SIGNATURE-windows.txt'
          if (-not (Test-Path -LiteralPath $webviewEvidence -PathType Leaf)) {
            throw 'WebView2 build-input evidence is missing'
          }
          if (-not (Test-Path -LiteralPath $webviewSignature -PathType Leaf)) {
            throw 'WebView2 signature verification report is missing'
          }
          $signatureArtifacts = @(Get-ChildItem -LiteralPath $bundleRoot -Recurse -Filter '*.sig' -File | Sort-Object FullName)
          $uploadArguments = @(
            'scripts/upload-draft-release-assets.mjs'
            '--repo', $env:GITHUB_REPOSITORY
            '--release-id', $env:RELEASE_ID
            '--tag', $env:TAG
            '--commit', $env:GITHUB_SHA
            '--'
          ) + @($artifacts.FullName) + @($signatureArtifacts.FullName) + @(
            $manifest, $msiInventory, $nsisInventory, $webviewEvidence, $webviewSignature
          )
          & node @uploadArguments
          if ($LASTEXITCODE -ne 0) { throw 'Windows draft asset upload failed' }

  dependency-evidence:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Fetch the locked Cargo graph
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Install hash-pinned dependency-evidence tools
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/dependency-tool-archives"
          extract_dir="$RUNNER_TEMP/dependency-tool-extract"
          bin_dir="$RUNNER_TEMP/dependency-tool-bin"
          mkdir -p "$archive_dir" "$extract_dir/about" "$extract_dir/cyclonedx" "$bin_dir"

          about_archive="$archive_dir/cargo-about.tar.gz"
          cyclonedx_archive="$archive_dir/cargo-cyclonedx.tar.xz"
          curl --proto '=https' --tlsv1.2 -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$CARGO_ABOUT_URL" -o "$about_archive"
          curl --proto '=https' --tlsv1.2 -fL --retry 5 --retry-all-errors --retry-delay 2 \
            "$CARGO_CYCLONEDX_URL" -o "$cyclonedx_archive"
          test "$(stat -c%s "$about_archive")" = "$CARGO_ABOUT_SIZE"
          test "$(stat -c%s "$cyclonedx_archive")" = "$CARGO_CYCLONEDX_SIZE"
          echo "$CARGO_ABOUT_SHA256  $about_archive" | sha256sum -c -
          echo "$CARGO_CYCLONEDX_SHA256  $cyclonedx_archive" | sha256sum -c -

          tar -xzf "$about_archive" -C "$extract_dir/about"
          tar -xJf "$cyclonedx_archive" -C "$extract_dir/cyclonedx"
          about_bin=$(find "$extract_dir/about" -type f -name cargo-about -print -quit)
          cyclonedx_bin=$(find "$extract_dir/cyclonedx" -type f -name cargo-cyclonedx -print -quit)
          test -n "$about_bin"
          test -n "$cyclonedx_bin"
          install -m 0755 "$about_bin" "$bin_dir/cargo-about"
          install -m 0755 "$cyclonedx_bin" "$bin_dir/cargo-cyclonedx"
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Verify dependency-evidence tool versions
        run: |
          set -euo pipefail
          test "$(cargo about --version)" = 'cargo-about 0.9.2'
          test "$(cargo cyclonedx --version)" = 'cargo-cyclonedx-cyclonedx 0.5.9'

      - name: Generate release dependency evidence
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          source_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          evidence_dir="$RUNNER_TEMP/depoaudio-dependency-evidence"
          generated_notice="$RUNNER_TEMP/THIRD-PARTY-LICENSES.generated.html"
          mkdir -p "$evidence_dir"

          npm ci
          node scripts/generate-javascript-notices.mjs --strict --check
          node scripts/normalize-release-sbom.mjs --self-test
          CARGO_NET_OFFLINE=true cargo about generate \
            --config about.toml \
            --manifest-path src-tauri/Cargo.toml \
            --locked --offline --fail \
            --output-file "$generated_notice" \
            scripts/third-party-licenses.hbs
          node scripts/normalize-cargo-about-report.mjs \
            --input "$generated_notice" \
            --output "$generated_notice"
          cmp "$generated_notice" src-tauri/resources/third-party/rust/THIRD-PARTY-LICENSES.html || {
            echo "ERROR: committed Rust third-party license report is stale"
            exit 1
          }
          cp src-tauri/resources/third-party/rust/THIRD-PARTY-LICENSES.html \
            "$evidence_dir/DepoAudio_${version}_rust-third-party-licenses.html"
          cp src-tauri/resources/third-party/javascript/THIRD-PARTY-NOTICES.html \
            "$evidence_dir/DepoAudio_${version}_javascript-third-party-notices.html"
          cp src-tauri/resources/third-party/javascript/COMPONENTS.json \
            "$evidence_dir/DepoAudio_${version}_javascript-components.json"
          cp THIRD_PARTY_LICENSES.md \
            "$evidence_dir/DepoAudio_${version}_third-party-review.md"

          for target in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            prefix="DepoAudio_${version}_rust"
            generated="src-tauri/${prefix}_${target}.cdx.json"
            normalized="$evidence_dir/DepoAudio_${version}_rust_${target}.cdx.json"
            first="$RUNNER_TEMP/rust-${target}-first.cdx.json"
            second="$RUNNER_TEMP/rust-${target}-second.cdx.json"
            for output in "$first" "$second"
            do
              SOURCE_DATE_EPOCH="$source_epoch" CARGO_NET_OFFLINE=true cargo cyclonedx \
                --manifest-path src-tauri/Cargo.toml \
                --format json \
                --target "$target" \
                --target-in-filename \
                --spec-version 1.5 \
                --no-build-deps \
                --override-filename "$prefix"
              test -s "$generated"
              node scripts/normalize-release-sbom.mjs \
                --input "$generated" \
                --output "$output" \
                --source-commit "$SOURCE_COMMIT" \
                --source-date-epoch "$source_epoch" \
                --ecosystem rust
            done
            cmp "$first" "$second" || {
              echo "ERROR: Rust SBOM is not reproducible for $target"
              exit 1
            }
            mv "$first" "$normalized"
          done

          npm_first="$RUNNER_TEMP/npm-first.cdx.json"
          npm_second="$RUNNER_TEMP/npm-second.cdx.json"
          for output in "$npm_first" "$npm_second"
          do
            npm_raw="$RUNNER_TEMP/npm-raw.cdx.json"
            npm sbom \
              --omit=dev \
              --package-lock-only \
              --sbom-format=cyclonedx \
              --sbom-type=application > "$npm_raw"
            node scripts/normalize-release-sbom.mjs \
              --input "$npm_raw" \
              --output "$output" \
              --source-commit "$SOURCE_COMMIT" \
              --source-date-epoch "$source_epoch" \
              --ecosystem npm
          done
          cmp "$npm_first" "$npm_second" || {
            echo 'ERROR: npm SBOM is not reproducible'
            exit 1
          }
          mv "$npm_first" "$evidence_dir/DepoAudio_${version}_npm.cdx.json"

          {
            node --version
            npm --version
            rustc --version
            cargo --version
            cargo about --version
            cargo cyclonedx --version
            echo "cargo-about archive: $CARGO_ABOUT_URL"
            echo "cargo-about SHA-256: $CARGO_ABOUT_SHA256"
            echo "cargo-cyclonedx archive: $CARGO_CYCLONEDX_URL"
            echo "cargo-cyclonedx SHA-256: $CARGO_CYCLONEDX_SHA256"
          } > "$evidence_dir/DEPENDENCY-EVIDENCE-TOOLCHAIN.txt"

          manifest="$evidence_dir/SHA256SUMS-dependency-evidence.txt"
          (
            cd "$evidence_dir"
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS-dependency-evidence.txt' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > "$manifest"
          cat "$manifest"

      - name: Preserve verified dependency evidence for release builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/depoaudio-dependency-evidence
          if-no-files-found: error
          retention-days: 7

  publish-dependency-evidence:
    needs: [prepare, release, dependency-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified dependency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/depoaudio-dependency-evidence

      - name: Publish dependency evidence to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/depoaudio-dependency-evidence"
          (
            cd "$evidence_dir"
            sha256sum -c SHA256SUMS-dependency-evidence.txt
          )
          node scripts/upload-draft-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" --release-id "$RELEASE_ID" \
            --tag "$TAG" --commit "$GITHUB_SHA" -- "$evidence_dir"/*

  # Leave one complete, commit-bound release private for human installation
  # review. Publication is a separate decision after the clean-machine gates.
  finalize:
    needs: [prepare, release, publish-dependency-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify the complete release remains a private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --argjson id "$RELEASE_ID" --arg tag "$TAG" --arg commit "$GITHUB_SHA" '
            .id == $id and
            .draft == true and
            .tag_name == $tag and
            .target_commitish == $commit and
            (.assets | length > 0) and
            all(.assets[]; .state == "uploaded" and .size > 0) and
            (([.assets[].name] | unique | length) == (.assets | length))
          ' <<<"$release" >/dev/null || {
            echo 'ERROR: the exact release is no longer a complete private draft'; exit 1;
          }
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo 'ERROR: a published release appeared before final draft verification'; exit 1;
          fi
          names=$(printf '%s' "$release" | jq -r '.assets[].name')
          require_one() {
            local description="$1" pattern="$2" count
            count=$(grep -Ec "$pattern" <<<"$names" || true)
            [ "$count" = '1' ] || {
              echo "ERROR: expected exactly one $description asset (found $count)"; exit 1;
            }
          }
          version=${TAG#v}
          version=${version%%-*}
          escaped_version=${version//./\\.}
          require_one 'macOS DMG' "^DepoAudio_${escaped_version}_universal\\.dmg$"
          require_one 'macOS app archive' "^DepoAudio_${escaped_version}_universal\\.app\\.tar\\.gz$"
          require_one 'Windows MSI' "^DepoAudio_${escaped_version}_x64_en-US\\.msi$"
          require_one 'Windows NSIS installer' "^DepoAudio_${escaped_version}_x64-setup\\.exe$"
          for required in \
            SHA256SUMS-macos.txt \
            SHA256SUMS-windows.txt \
            SHA256SUMS-third-party-source.txt \
            SHA256SUMS-dependency-evidence.txt \
            RELEASE-INVENTORY-macos-dmg.json \
            RELEASE-INVENTORY-macos-app-archive.json \
            RELEASE-INVENTORY-windows-msi.json \
            RELEASE-INVENTORY-windows-nsis.json \
            WEBVIEW2-EVIDENCE-windows.json \
            WEBVIEW2-SIGNATURE-windows.txt
          do
            require_one "$required" "^${required//./\\.}$"
          done
          require_one 'macOS third-party source archive' "^DepoAudio_${escaped_version}_third-party-source\\.tar\\.gz$"
          require_one 'Rust third-party license report' "^DepoAudio_${escaped_version}_rust-third-party-licenses\\.html$"
          require_one 'JavaScript third-party notice report' "^DepoAudio_${escaped_version}_javascript-third-party-notices\\.html$"
          require_one 'JavaScript notice component manifest' "^DepoAudio_${escaped_version}_javascript-components\\.json$"
          require_one 'reviewed third-party ledger' "^DepoAudio_${escaped_version}_third-party-review\\.md$"
          require_one 'dependency evidence toolchain record' '^DEPENDENCY-EVIDENCE-TOOLCHAIN\\.txt$'
          require_one 'production npm SBOM' "^DepoAudio_${escaped_version}_npm\\.cdx\\.json$"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            require_one "Rust $target SBOM" "^DepoAudio_${escaped_version}_rust_${target}\\.cdx\\.json$"
          done

          signature_count=$(grep -Ec '\\.sig$' <<<"$names" || true)
          latest_count=$(grep -Ec '^latest\\.json$' <<<"$names" || true)
          [ "$latest_count" = '0' ] || {
            echo 'ERROR: latest.json must be generated only by the separate publication approval step'; exit 1;
          }
          if [ "$signature_count" != '0' ]; then
            require_one 'universal macOS updater signature' '\\.app\\.tar\\.gz\\.sig$'
            windows_signatures=$(grep -Ec '\\.(msi|exe)\\.sig$' <<<"$names" || true)
            [ "$windows_signatures" -ge 1 ] || {
              echo 'ERROR: updater signing is incomplete across platforms'; exit 1;
            }
          fi
          printf '%s' "$release" | jq -r '.assets[] | "  \(.name)  (\(.size) bytes)"'
          pointer="$RUNNER_TEMP/RELEASE-CANDIDATE-POINTER.json"
          printf '%s' "$release" | jq \
            --arg sourceCommit "$GITHUB_SHA" \
            --arg workflowRunUrl "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{
              schemaVersion: 1,
              releaseNumericId: .id,
              tag: .tag_name,
              sourceCommit: $sourceCommit,
              draft: .draft,
              prerelease: .prerelease,
              workflowRunUrl: $workflowRunUrl,
              assets: [.assets[] | {name, size}]
            }' > "$pointer"
          echo "Verified private draft $RELEASE_ID for $TAG at $GITHUB_SHA"

      - name: Preserve sanitized candidate pointer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-pointer-${{ github.sha }}
          path: ${{ runner.temp }}/RELEASE-CANDIDATE-POINTER.json
          if-no-files-found: error
          retention-days: 30
