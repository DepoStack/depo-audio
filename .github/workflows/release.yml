name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.9.0)'
        required: true
        type: string

# One release run per tag at a time: overlapping runs for the same tag can
# split platforms across drafts (each leg looks the release up independently).
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Static, self-contained ffmpeg/ffprobe assets. Homebrew's ffmpeg is
  # dynamically linked against Cellar dylibs and would fail on a clean Mac.
  # GitHub release asset IDs are immutable. Replacement assets receive new
  # IDs, so these downloads fail closed if an upstream release is re-cut.
  FFMPEG_MAC_ARM64_ID: '202650084'
  FFMPEG_MAC_ARM64_SIZE: '47078120'
  FFMPEG_MAC_X64_ID: '202650083'
  FFMPEG_MAC_X64_SIZE: '75991688'
  FFPROBE_MAC_ARM64_ID: '202650098'
  FFPROBE_MAC_ARM64_SIZE: '47037128'
  FFPROBE_MAC_X64_ID: '202650090'
  FFPROBE_MAC_X64_SIZE: '75917176'
  # BtbN deletes ordinary daily assets after its rolling retention window.
  # Pin the 2026-07-31 month-end build, which upstream retains for two years,
  # instead of an asset from the short-lived `latest` release.
  FFMPEG_WIN_ID: '496767003'
  FFMPEG_WIN_SIZE: '169718043'
  FFMPEG_WIN_SHA256: '68a5e966533002785c3e4b9a98327e21d5277802668bf889d94086cb6426cbb4'
  ORT_MAC_ID: '253300416'
  ORT_MAC_SIZE: '54820264'
  ORT_WIN_ID: '253300435'
  ORT_WIN_SIZE: '72368545'
  FTR_SMOKE_URL: 'https://samples.ffmpeg.org/ffmpeg-bugs/trac/ticket7279/t1.trm'
  FTR_SMOKE_SIZE: '3775794'
  FTR_SMOKE_SHA256: '60993c1f5379d56d43f231ea5391504f9c808daf8978fba80e5ad60e81c4c4d7'

jobs:
  # Guard the release before any build starts:
  #  - the tag must match the configured app version, so binaries can't ship
  #    self-reporting a different version than their tag
  #  - any stale DRAFT release carrying this tag is deleted, so tauri-action
  #    creates a fresh draft whose target_commitish is THIS run's commit (a
  #    reused draft keeps its old commitish, and publishing it would mint the
  #    git tag at the wrong commit) and whose assets can't mix with an older
  #    build's. Published releases are never touched.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches the configured app version
        env:
          # env indirection: never interpolate the expression into shell
          # source, so the value can't be parsed as script
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          tag = os.environ['TAG']
          with open('src-tauri/tauri.conf.json', encoding='utf-8') as handle:
              version = json.load(handle)['version']
          pattern = rf"v{re.escape(version)}(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?"
          if re.fullmatch(pattern, tag) is None:
              raise SystemExit(
                  f"ERROR: tag {tag!r} is not a safe release tag for app version {version!r}"
              )
          print(f"Tag {tag} matches app version {version}")
          PY

      - name: Verify release commit and published-release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          tagged_commit=$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)
          if [ -n "$tagged_commit" ] && [ "$tagged_commit" != "$GITHUB_SHA" ]; then
            echo "ERROR: existing tag $tag resolves to $tagged_commit, not this run's $GITHUB_SHA"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "ERROR: a published release already exists for $tag; refusing to replace its assets"
            exit 1
          fi
          if [ -n "$tagged_commit" ]; then
            echo "Existing tag $tag resolves to this run's commit $GITHUB_SHA"
          else
            echo "Tag $tag does not exist yet and may be created at $GITHUB_SHA"
          fi

      - name: Delete stale draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate |
            jq -r --arg tag "$tag" '.[] | select(.draft == true and .tag_name == $tag) | .id' |
            while IFS= read -r id; do
              echo "Deleting stale draft release $id (tag_name $tag). Assets it held:"
              gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
                --jq '.assets[] | "  \(.name)  (\(.download_count) downloads)"' || echo "  (no assets)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

  release:
    needs: prepare
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # Serialize the platform builds: tauri-action does a read-modify-write of
      # the draft release's latest.json, so two jobs writing it concurrently
      # would clobber one platform's updater keys. One-at-a-time is safe.
      max-parallel: 1
      matrix:
        include:
          # One universal macOS artifact (Apple Silicon + Intel in a single
          # .app/.dmg). Rust cross-compiles both slices on the hosted macOS
          # runner and `lipo` fuses them, independent of the runner's host CPU.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-05)
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Create binaries directory
        run: mkdir -p src-tauri/binaries

      # ── FFmpeg sidecars ─────────────────────────────────────────────────
      # macOS: download STATIC per-arch ffmpeg + ffprobe, verify each is
      # self-contained (no Homebrew/Cellar deps), and stage them for the
      # universal build. Tauri's --target universal-apple-darwin compiles each
      # arch as a SEPARATE sub-build and resolves each externalBin by that
      # arch's own triple, so the per-arch names (ffmpeg-aarch64-apple-darwin /
      # ffmpeg-x86_64-apple-darwin) are what's actually required; the CLI lipos
      # them for the final universal bundle. We also emit the -universal-apple-
      # darwin fat binary as a harmless belt-and-suspenders fallback.
      - name: Build universal FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ffbin
          download_asset() {
            repo="$1"; asset_id="$2"; output="$3"; expected_size="$4"
            curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer ${GH_DOWNLOAD_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/releases/assets/${asset_id}" \
              -o "$output"
            actual_size=$(stat -f%z "$output")
            test "$actual_size" = "$expected_size" || {
              echo "ERROR: $output size $actual_size does not match pinned size $expected_size"; exit 1;
            }
          }
          download_asset descriptinc/ffmpeg-ffprobe-static "$FFMPEG_MAC_ARM64_ID" ffbin/ffmpeg-arm64 "$FFMPEG_MAC_ARM64_SIZE"
          download_asset descriptinc/ffmpeg-ffprobe-static "$FFMPEG_MAC_X64_ID" ffbin/ffmpeg-x64 "$FFMPEG_MAC_X64_SIZE"
          download_asset descriptinc/ffmpeg-ffprobe-static "$FFPROBE_MAC_ARM64_ID" ffbin/ffprobe-arm64 "$FFPROBE_MAC_ARM64_SIZE"
          download_asset descriptinc/ffmpeg-ffprobe-static "$FFPROBE_MAC_X64_ID" ffbin/ffprobe-x64 "$FFPROBE_MAC_X64_SIZE"
          chmod +x ffbin/*
          echo "== pinned sidecar sha256 =="; shasum -a 256 ffbin/*
          # Guard (allowlist, not denylist): a real static sidecar may only
          # depend on system libraries under /usr/lib or /System/Library. Any
          # other dependency — Homebrew, /usr/local, or an @rpath/@loader_path
          # reference — means it would dyld-fail on a clean end-user Mac, so
          # fail the build instead of shipping it. Checked per thin binary
          # BEFORE lipo.
          for f in ffbin/ffmpeg-arm64 ffbin/ffmpeg-x64 ffbin/ffprobe-arm64 ffbin/ffprobe-x64; do
            echo "== $f =="; file "$f"; otool -L "$f"
            bad=$(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^/usr/lib/|^/System/Library/' || true)
            if [ -n "$bad" ]; then
              echo "ERROR: $f is not self-contained — non-system dependencies:"; echo "$bad"; exit 1
            fi
          done
          for name in ffmpeg ffprobe; do
            # Per-arch thin sidecars under Tauri's target triples — REQUIRED:
            # each per-arch sub-build of the universal target resolves the
            # externalBin by its own triple (arm64 static -> aarch64 triple,
            # x64 static -> x86_64 triple).
            cp "ffbin/$name-arm64" "src-tauri/binaries/$name-aarch64-apple-darwin"
            cp "ffbin/$name-x64"   "src-tauri/binaries/$name-x86_64-apple-darwin"
            chmod +x "src-tauri/binaries/$name-aarch64-apple-darwin" \
                     "src-tauri/binaries/$name-x86_64-apple-darwin"
            # Universal fat binary — fallback in case a Tauri version resolves
            # the externalBin by the universal triple at final assembly.
            lipo -create "ffbin/$name-arm64" "ffbin/$name-x64" \
              -output "src-tauri/binaries/$name-universal-apple-darwin"
            chmod +x "src-tauri/binaries/$name-universal-apple-darwin"
            archs=$(lipo -archs "src-tauri/binaries/$name-universal-apple-darwin")
            echo "$name universal archs: $archs"
            case "$archs" in
              *x86_64*arm64*|*arm64*x86_64*) : ;;
              *) echo "ERROR: $name is not universal (got: $archs)"; exit 1 ;;
            esac
            "src-tauri/binaries/$name-aarch64-apple-darwin" -version | head -1
          done

      - name: Download FFmpeg (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_DOWNLOAD_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $url = "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/assets/$env:FFMPEG_WIN_ID"
          Invoke-WebRequest $url -Headers $headers -OutFile ffmpeg.zip
          if ((Get-Item ffmpeg.zip).Length -ne [int64]$env:FFMPEG_WIN_SIZE) {
            throw "Pinned FFmpeg archive size mismatch"
          }
          $hash = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FFMPEG_WIN_SHA256) { throw "Pinned FFmpeg archive hash mismatch: $hash" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $bin   = Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffmpeg.exe"  | Select-Object -First 1
          $probe = Get-ChildItem ffmpeg_tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $bin.FullName   src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          Copy-Item $probe.FullName src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe

      - name: Verify FFmpeg sidecars (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== src-tauri/binaries/ ==="
          ls -lh src-tauri/binaries/
          file src-tauri/binaries/ff* || true

      - name: Verify FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-ChildItem src-tauri/binaries/

      - name: Smoke-test native FTR decoding (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 "$FTR_SMOKE_URL" -o ftr-smoke.trm
          test "$(stat -f%z ftr-smoke.trm)" = "$FTR_SMOKE_SIZE" || { echo "ERROR: FTR fixture size mismatch"; exit 1; }
          echo "$FTR_SMOKE_SHA256  ftr-smoke.trm" | shasum -a 256 -c -
          for ffmpeg in \
            src-tauri/binaries/ffmpeg-aarch64-apple-darwin \
            src-tauri/binaries/ffmpeg-x86_64-apple-darwin
          do
            "$ffmpeg" -hide_banner -v error \
              -c:a ftr -t 5 -i ftr-smoke.trm -map 0:a:0 -f null -
          done

      - name: Smoke-test native FTR decoding (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FTR_SMOKE_URL -OutFile ftr-smoke.trm
          if ((Get-Item ftr-smoke.trm).Length -ne [int64]$env:FTR_SMOKE_SIZE) { throw "FTR fixture size mismatch" }
          $hash = (Get-FileHash ftr-smoke.trm -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:FTR_SMOKE_SHA256) { throw "FTR fixture hash mismatch: $hash" }
          & src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -v error `
            -c:a ftr -t 5 -i ftr-smoke.trm -map 0:a:0 -f null NUL
          if ($LASTEXITCODE -ne 0) { throw "Bundled FFmpeg failed native FTR decode smoke test" }

      # ── ONNX Runtime ────────────────────────────────────────────────────
      # macOS: Microsoft ships a ready-made universal2 (fat) dylib — no lipo
      # needed. The bundled .dylib is a symlink to the versioned real file, so
      # copy with -L to stage the actual Mach-O, not a dangling link. The
      # release-only config below adds this path as a macOS framework so Tauri
      # signs it inside-out before signing the app bundle.
      - name: Download universal ONNX Runtime (macOS)
        if: runner.os == 'macOS'
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/onnxruntime
          curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_DOWNLOAD_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/microsoft/onnxruntime/releases/assets/${ORT_MAC_ID}" \
            -o ort.tgz
          actual_size=$(stat -f%z ort.tgz)
          test "$actual_size" = "$ORT_MAC_SIZE" || { echo "ERROR: pinned ONNX Runtime archive size mismatch"; exit 1; }
          tar xzf ort.tgz
          ort_dir=$(ls -d onnxruntime-osx-universal2-*)
          cp -L "$ort_dir/lib/libonnxruntime.dylib" src-tauri/resources/onnxruntime/libonnxruntime.dylib
          file src-tauri/resources/onnxruntime/libonnxruntime.dylib
          archs=$(lipo -archs src-tauri/resources/onnxruntime/libonnxruntime.dylib)
          echo "ORT dylib archs: $archs"
          case "$archs" in
            *x86_64*arm64*|*arm64*x86_64*) : ;;
            *) echo "ERROR: ORT dylib is not universal (got: $archs)"; exit 1 ;;
          esac

      - name: Download ONNX Runtime CPU package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/onnxruntime | Out-Null
          $headers = @{
            Accept = "application/octet-stream"
            Authorization = "Bearer $env:GH_DOWNLOAD_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-WebRequest "https://api.github.com/repos/microsoft/onnxruntime/releases/assets/$env:ORT_WIN_ID" -Headers $headers -OutFile ort.zip
          if ((Get-Item ort.zip).Length -ne [int64]$env:ORT_WIN_SIZE) {
            throw "Pinned ONNX Runtime archive size mismatch"
          }
          Expand-Archive ort.zip -DestinationPath ort_tmp -Force
          $dll = Get-ChildItem ort_tmp -Recurse -Filter "onnxruntime.dll" | Select-Object -First 1
          Copy-Item $dll.FullName "src-tauri/resources/onnxruntime/onnxruntime.dll"
          Get-ChildItem src-tauri/resources/onnxruntime/

      - name: Smoke-test bundled ONNX Runtime (macOS)
        if: runner.os == 'macOS'
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/src-tauri/resources/onnxruntime/libonnxruntime.dylib
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml ort_loads_and_runs_silero_vad -- --ignored --nocapture

      - name: Smoke-test bundled ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}\src-tauri\resources\onnxruntime\onnxruntime.dll
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml ort_loads_and_runs_silero_vad -- --ignored --nocapture

      # ── Release signing (opt-in) ────────────────────────────────────────
      # Code signing / notarization and signed auto-updates are OPT-IN and
      # switch on per-capability once their secrets exist. Until then the
      # release still ships: an ad-hoc-signed macOS app and unsigned Windows
      # installers, with the in-app updater dormant. Platform warnings may
      # appear, but their exact behavior must be verified for each published
      # asset. Adding the secrets later enables signing/updates with no workflow
      # change. This detects what's present; it never fails closed.
      - name: Detect signing configuration
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          have() { for n in "$@"; do [ -n "${!n:-}" ] || return 1; done; return 0; }

          updater=false
          if have TAURI_SIGNING_PRIVATE_KEY TAURI_UPDATER_PUBLIC_KEY; then
            updater=true
          else
            echo "::notice::Updater signing secrets absent — building without signed auto-update artifacts (updater stays dormant)."
          fi

          platform_signing=false
          if [ "$RUNNER_OS" = "macOS" ]; then
            if have APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; then
              platform_signing=true
            else
              echo "::notice::Apple signing/notarization secrets absent — building an UNSIGNED macOS app (ad-hoc signature)."
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if have WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_THUMBPRINT; then
              platform_signing=true
            else
              echo "::notice::Windows signing secrets absent — building an UNSIGNED Windows installer."
            fi
          fi

          {
            echo "updater=$updater"
            echo "platform_signing=$platform_signing"
          } >> "$GITHUB_OUTPUT"

      # The Tauri CLI has a signer but no verify subcommand. Sign a disposable
      # nonce with the exact project-pinned CLI, then verify that signature
      # using the same minisign-verify version/checksum locked by the app's
      # updater dependency. No key material is written or printed.
      - name: Verify updater signing key pair
        if: steps.signing.outputs.updater == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          verify_dir=$(mktemp -d "${RUNNER_TEMP}/depoaudio-key-check.XXXXXX")
          trap 'rm -rf -- "$verify_dir"' EXIT

          payload="$verify_dir/updater-key-check"
          printf '%s\n' "depo-audio:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$RUNNER_OS" > "$payload"
          npm run tauri -- signer sign "$payload" >/dev/null
          test -s "$payload.sig" || {
            echo "::error::Tauri signer did not create a signature"; exit 1;
          }
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          mkdir -p "$verify_dir/src"
          cat > "$verify_dir/Cargo.toml" <<'TOML'
          [package]
          name = "depoaudio-updater-key-check"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          base64 = "=0.22.1"
          minisign-verify = "=0.2.5"
          TOML
          cat > "$verify_dir/Cargo.lock" <<'LOCK'
          # This file is automatically @generated by Cargo.
          # It is not intended for manual editing.
          version = 4

          [[package]]
          name = "base64"
          version = "0.22.1"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "72b3254f16251a8381aa12e40e3c4d2f0199f8c6508fbecb9d91f575e0fbb8c6"

          [[package]]
          name = "depoaudio-updater-key-check"
          version = "0.0.0"
          dependencies = [
           "base64",
           "minisign-verify",
          ]

          [[package]]
          name = "minisign-verify"
          version = "0.2.5"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "22f9645cb765ea72b8111f36c522475d2daa0d22c957a9826437e97534bc4e9e"
          LOCK
          cat > "$verify_dir/src/main.rs" <<'RUST'
          use base64::{engine::general_purpose::STANDARD, Engine as _};
          use minisign_verify::{PublicKey, Signature};
          use std::{env, fs, path::PathBuf};

          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let mut args = env::args_os().skip(1);
              let payload = PathBuf::from(args.next().ok_or("missing payload path")?);
              let signature_path = PathBuf::from(args.next().ok_or("missing signature path")?);
              if args.next().is_some() {
                  return Err("unexpected verifier argument".into());
              }

              // Tauri updater configuration stores base64 of the complete
              // Minisign public-key file, and .sig contains base64 of the
              // complete Minisign signature. Decode exactly as the updater.
              let public_key_encoded = env::var("TAURI_UPDATER_PUBLIC_KEY")?;
              let public_key_text = String::from_utf8(
                  STANDARD
                      .decode(public_key_encoded.trim())
                      .map_err(|_| "updater public key is not valid base64")?,
              )?;
              let public_key = PublicKey::decode(public_key_text.trim())
                  .map_err(|error| format!("invalid updater public key: {error}"))?;

              let signature_encoded = fs::read_to_string(&signature_path)?;
              let signature_text = String::from_utf8(
                  STANDARD
                      .decode(signature_encoded.trim())
                      .map_err(|_| "Tauri signature is not valid base64")?,
              )?;
              let signature = Signature::decode(signature_text.trim())
                  .map_err(|error| format!("invalid Tauri signature: {error}"))?;
              let data = fs::read(payload)?;
              public_key
                  .verify(&data, &signature, true)
                  .map_err(|error| format!("configured updater keys do not match: {error}"))?;
              println!("Updater signing key pair verified.");
              Ok(())
          }
          RUST

          cargo run --locked --quiet --manifest-path "$verify_dir/Cargo.toml" -- \
            "$payload" "$payload.sig"

      # Release Tauri config overlay, always generated. It stages the ONNX
      # Runtime library where the runtime loader (src-tauri/src/lib.rs) resolves
      # it — a macOS framework (Contents/Frameworks/libonnxruntime.dylib) so it
      # is signed inside-out and survives notarization, and a Windows resource
      # (resources/onnxruntime/onnxruntime.dll). Signed updater artifacts and
      # Windows Authenticode signing are layered on ONLY when their secrets are
      # present. Tauri deep-merges this overlay onto tauri.conf.json.
      - name: Generate release configuration
        shell: bash
        env:
          UPDATER_ENABLED: ${{ steps.signing.outputs.updater }}
          PLATFORM_SIGNING: ${{ steps.signing.outputs.platform_signing }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          set -euo pipefail
          jq \
            --arg pubkey "$TAURI_UPDATER_PUBLIC_KEY" \
            --arg runner "$RUNNER_OS" \
            --arg thumbprint "$WINDOWS_CERTIFICATE_THUMBPRINT" \
            --argjson updater "$UPDATER_ENABLED" \
            --argjson platformSigning "$PLATFORM_SIGNING" '
            # ONNX Runtime placement — always, matched to the lib.rs loader.
            (if $runner == "Windows" then {
                resources: (.bundle.resources + ["resources/onnxruntime/onnxruntime.dll"])
              } elif $runner == "macOS" then {
                macOS: { frameworks: ["resources/onnxruntime/libonnxruntime.dylib"] }
              } else error("unsupported release runner: " + $runner) end) as $ort
            # Signed auto-update artifacts — only with updater secrets.
            | (if $updater then { createUpdaterArtifacts: true } else {} end) as $upd
            # Windows Authenticode signing — only with the Windows cert.
            | (if ($platformSigning and $runner == "Windows") then {
                windows: {
                  certificateThumbprint: $thumbprint,
                  digestAlgorithm: "sha256",
                  timestampUrl: "http://timestamp.digicert.com"
                }
              } else {} end) as $win
            | {
                bundle: ($ort + $upd + $win)
              }
              + (if $updater then {
                  plugins: { updater: {
                    endpoints: ["https://github.com/DepoStack/depo-audio/releases/latest/download/latest.json"],
                    pubkey: $pubkey
                  } }
                } else {} end)
          ' src-tauri/tauri.conf.json > src-tauri/tauri.release.conf.json
          echo "== generated tauri.release.conf.json =="
          cat src-tauri/tauri.release.conf.json

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.platform_signing == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "depoaudio-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item -LiteralPath $pfx -Force
          $certificate = Get-Item "Cert:\CurrentUser\My\$env:WINDOWS_CERTIFICATE_THUMBPRINT" -ErrorAction Stop
          if (!$certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }

      # macOS signing credentials are exported here via $GITHUB_ENV rather than
      # the build step's static env, because an unset secret still expands to an
      # EMPTY (present) variable in a step `env:` block, and the Tauri bundler
      # treats a present APPLE_CERTIFICATE as "sign with this cert" — it then
      # runs `security import` on empty data and fails. For an unsigned build we
      # must leave APPLE_CERTIFICATE / APPLE_ID genuinely UNSET and only pin the
      # ad-hoc identity ("-"), matching v1.0.0 and the earlier v1.0.1 draft.
      # When Apple secrets are present we export the full set so tauri-action
      # imports the certificate and notarizes.
      - name: Configure macOS code signing identity
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLATFORM_SIGNING: ${{ steps.signing.outputs.platform_signing }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM_SIGNING" = "true" ]; then
            {
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_CERTIFICATE<<__DEPOAUDIO_EOF__"
              echo "$APPLE_CERTIFICATE"
              echo "__DEPOAUDIO_EOF__"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            # Unsigned: ad-hoc identity, and APPLE_CERTIFICATE/APPLE_ID stay
            # unset so the bundler skips `security import` and notarization.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # ── Build & release ────────────────────────────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing key. Empty when no updater secret is set;
          # the Tauri bundler only consumes it when createUpdaterArtifacts is
          # true (i.e. when the updater overlay is active), so an empty value is
          # inert on an unsigned build. All Apple signing/notarization
          # credentials are provided instead by the "Configure macOS code
          # signing identity" step via $GITHUB_ENV — and deliberately left UNSET
          # (not empty) on an unsigned build so the bundler skips cert import.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          releaseName: 'DepoAudio ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for details.'
          releaseDraft: true
          # Preview releases: a tag with a pre-release suffix (e.g.
          # v1.0.0-preview.1, -rc.1, -beta.2) is marked as a GitHub prerelease;
          # a clean tag (v1.0.0) ships as a final release.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          # Updater metadata/signatures only when updater signing is configured;
          # the config overlay (which stages ONNX Runtime) is always applied.
          uploadUpdaterJson: ${{ steps.signing.outputs.updater }}
          uploadUpdaterSignatures: ${{ steps.signing.outputs.updater }}
          args: '--config src-tauri/tauri.release.conf.json ${{ matrix.args }}'

      # The component checks above do not exercise Tauri's embedded plugin
      # configuration. Launch the exact bundled application before the workflow
      # can finish so a setup panic is visible before anyone publishes the draft.
      - name: Smoke-test packaged app startup (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\target\release\bundle\msi'
          $msi = Get-ChildItem -LiteralPath $bundleRoot -Filter '*.msi' -File | Select-Object -First 1
          if (-not $msi) { throw "No packaged MSI found under $bundleRoot" }

          $extractDir = Join-Path $env:RUNNER_TEMP 'depoaudio-msi-smoke'
          $msiLog = Join-Path $env:RUNNER_TEMP 'depoaudio-msi-smoke.log'
          $extract = Start-Process msiexec.exe -ArgumentList @(
            '/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$extractDir`"", '/L*v', "`"$msiLog`""
          ) -Wait -PassThru
          if ($extract.ExitCode -ne 0) {
            Get-Content -LiteralPath $msiLog -Tail 200
            throw "MSI administrative extraction failed with exit code $($extract.ExitCode)"
          }

          $app = Get-ChildItem -LiteralPath $extractDir -Recurse -Filter 'depo-audio.exe' -File | Select-Object -First 1
          if (-not $app) { throw 'The extracted MSI does not contain depo-audio.exe' }
          $stdout = Join-Path $env:RUNNER_TEMP 'depoaudio-startup-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'depoaudio-startup-stderr.txt'
          $process = Start-Process -FilePath $app.FullName -WorkingDirectory $app.DirectoryName -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(12)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            } while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline)

            if ($process.HasExited) {
              Write-Host '== packaged app stdout =='
              if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout }
              Write-Host '== packaged app stderr =='
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr }
              throw "Packaged app exited during startup with code $($process.ExitCode)"
            }
            Write-Host 'Packaged Windows app remained alive through the startup smoke window.'
          } finally {
            if (-not $process.HasExited) {
              $process.Kill($true)
              $process.WaitForExit()
            }
          }

      - name: Smoke-test packaged app startup (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
            -path '*/DepoAudio.app/Contents/MacOS/depo-audio' -type f -print -quit)
          test -n "$app" || { echo "ERROR: packaged macOS executable not found"; exit 1; }

          stdout="$RUNNER_TEMP/depoaudio-startup-stdout.txt"
          stderr="$RUNNER_TEMP/depoaudio-startup-stderr.txt"
          "$app" >"$stdout" 2>"$stderr" &
          pid=$!
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for _ in {1..24}; do
            sleep 0.5
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              echo '== packaged app stdout =='; cat "$stdout" || true
              echo '== packaged app stderr =='; cat "$stderr" || true
              echo "ERROR: packaged app exited during startup with code ${status:-0}"
              exit 1
            fi
          done
          echo 'Packaged macOS app remained alive through the startup smoke window.'

  # If a draft is published while a later matrix leg is still building, that
  # leg can strand its artifacts in a new draft. Copy only asset names absent
  # from the published release after verifying draft/release/tag commit
  # identity. Any collision (especially latest.json) fails closed; published
  # assets are never merged, replaced, or uploaded with --clobber.
  finalize:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/promote-draft.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
