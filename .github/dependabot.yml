version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-core:
        patterns:
          - react
          - react-dom
      radix-ui:
        patterns:
          - '@radix-ui/*'
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ORT binding updates must move in lockstep with the signed native runtime,
    # CoreML feature wiring, and real-model release smoke tests.
    ignore:
      - dependency-name: ort
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - ci
