[package]
name = "depo-audio"
version = "1.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[lib]
name = "depo_audio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
regex = "1"
# Timestamps (UTC only; see src/clock.rs). Replaced chrono, which is
# unmaintained (RUSTSEC-2026-0543); already in the Tauri build graph.
time = { version = "0.3.47", features = ["std"] }
uuid = { version = "1", features = ["v4"] }
# SHA-256 for the export record (DA-08); already in the Tauri build graph
sha2 = "0.10"

# System
dirs-next = "2.0"

# Audio containers and non-learned signal processing
hound = "3.5"

# Desktop only (these plugins don't build for mobile): auto-update via GitHub
# Releases, and system-wide Player keys (off until the person turns them on)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Time"] }

# The local UTC offset for SGMCA segment start times (src/clock.rs);
# already in the Tauri build graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Tests parse RFC 3339 strings and build fixed instants; the app itself only
# formats timestamps, so these features stay out of the release build.
time = { version = "0.3.47", features = ["macros", "parsing"] }
