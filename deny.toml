# Dependency policy for the Rust application graph. This is intentionally
# limited to Cargo-resolved packages; release sidecars, native runtimes, model
# weights, and installer-added payloads are governed by THIRD_PARTY_LICENSES.md.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# Time-bounded v1.0.3 maintenance exception.
# Owner: Andrew Mayes (DepoStack release maintainer)
# Review/remove by: 2026-09-30, or immediately when the first published Tauri
# release includes tauri-apps/tauri#15660 (urlpattern 0.6), whichever is sooner.
# Rationale: these five INFO/unmaintained advisories have no patched unic 0.9
# versions. They enter only through urlpattern 0.3 -> tauri-utils 2.9.3. The
# released capability contract has no Capability.remote URLs, so the parser is
# distributed but has no configured untrusted-input path. Every other current
# or future advisory remains blocking.
ignore = [
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0098",
]

[licenses]
# This allowlist is the smallest set needed by the current locked release-target
# graph. An allowed license can still carry attribution, notice, source, or
# file-level copyleft obligations; cargo-deny is a policy gate, not a notice
# generator or legal conclusion.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
# Tauri's graph currently resolves some crates at multiple versions. Surface
# that debt without turning an unrelated ecosystem convergence issue into an
# emergency release blocker.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# Release builds may resolve Rust crates only from crates.io. Any future git or
# alternate-registry dependency must receive an explicit, reviewed exception.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
